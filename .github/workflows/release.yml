name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Check version matches tag
        run: |
          v=$(python -c "import tweensy; print(tweensy.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tweensy.__version__ is $v but tag is ${GITHUB_REF_NAME}"; exit 1; }

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller
      - name: Build the app
        run: python scripts/build_app.py
      - name: Smoke test (start it, load the page, call the API)
        shell: bash
        run: python scripts/smoke_test.py "dist/tweensy$([ "$RUNNER_OS" = Windows ] && echo .exe)"
      - uses: actions/upload-artifact@v4
        with:
          name: tweensy-${{ matrix.os }}
          path: dist/release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Downloads
          - **Windows:** `Tweensy-windows-…exe`. Double-click it. If Windows warns, click **More info → Run anyway**.
          - **Mac (Apple Silicon):** `Tweensy-mac-…dmg`. Open it, then right-click **Tweensy → Open** the first time.
          - **Linux:** `Tweensy-linux-…tar.gz`. Extract it and run `./tweensy`.

          You still need Claude Code signed in to your Claude plan; the Setup screen walks you through it.
          NOTES
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "${GITHUB_REF_NAME}" files/* --title "Tweensy ${GITHUB_REF_NAME}" --notes-file notes.md

  # Install the just-published release with the one-line installers, then start what they installed.
  install-test:
    name: Installer (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run install.sh
        if: runner.os != 'Windows'
        env:
          TWEENSY_VERSION: ${{ github.ref_name }}
          TWEENSY_NO_START: "1"
          TWEENSY_NO_MODIFY_PATH: "1"
          TWEENSY_PORT: "8799"
        run: |
          sh install.sh
          grep -q '"port": 8799' "$HOME/Tweensy/settings.json"
          python scripts/smoke_test.py "$HOME/.local/bin/tweensy"
      - name: Run install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TWEENSY_VERSION: ${{ github.ref_name }}
          TWEENSY_NO_START: "1"
          TWEENSY_PORT: "8799"
        run: |
          .\install.ps1
          if (-not (Select-String -Quiet '"port": 8799' "$env:USERPROFILE\Tweensy\settings.json")) { throw "port not saved" }
          python scripts/smoke_test.py "$env:LOCALAPPDATA\Programs\Tweensy\tweensy.exe"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Tweensy.lnk")) { throw "no Start menu shortcut" }

